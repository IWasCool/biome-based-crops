plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

// Every target has its own dependencies, sources and build output. Never widen a
// release JAR's Minecraft range to substitute for compiling a real port.
def requestedMinecraft = providers.gradleProperty('mcVersion')
def targetMinecraft = requestedMinecraft.getOrElse(minecraft_version)
if (targetMinecraft == '1.21.0') targetMinecraft = '1.21'
def targetProfileFile = file("versions/${targetMinecraft}.properties")
if (!targetProfileFile.isFile()) {
    throw new GradleException("Unsupported Minecraft target '${targetMinecraft}'. See versions/ for available targets.")
}
def targetProfile = new Properties()
targetProfileFile.withInputStream { targetProfile.load(it) }
targetProfile.each { key, value -> extensions.extraProperties.set(key.toString(), value.toString()) }
if (minecraft_version != targetMinecraft) throw new GradleException('Minecraft profile does not match the requested target')
if (requestedMinecraft.isPresent()) layout.buildDirectory.set(file("build/versions/${targetMinecraft}"))
if (requestedMinecraft.isPresent() && gradle.startParameter.projectCacheDir == null) {
    throw new GradleException('Version builds need an isolated Gradle history. Use build-all.ps1/build-all.sh, or add --project-cache-dir .gradle/versions/' + targetMinecraft)
}
def compatibilitySmoke = providers.gradleProperty('compatSmoke').getOrElse('false').toBoolean()
if (compatibilitySmoke) {
    def prepareVersionTests = tasks.register('prepareVersionTests', Sync) {
        from('src/compatTest/java')
        into layout.buildDirectory.dir('versionSources/tests')
        filteringCharset = 'UTF-8'
        if (targetMinecraft == '1.21.11') {
            filter { String line -> line.replaceAll(/\bResourceLocation\b/, 'Identifier')
                    .replace('.location()', '.identifier()')
                    .replace('readResourceLocation', 'readIdentifier').replace('writeResourceLocation', 'writeIdentifier') }
        }
    }
    sourceSets.test.java.setSrcDirs([prepareVersionTests])
}

def overlayVersions = targetProfile.getProperty('overlay_parents', '').tokenize(',') + [targetMinecraft]
def overlayDirectories = (targetMinecraft == '1.21.1' ? [] : [file('src/versions/common')]) +
        overlayVersions.collect { file("src/versions/${it}") }
def prepareVersionJava = tasks.register('prepareVersionJava', Sync) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    overlayDirectories.reverseEach { from(new File(it, 'java')) }
    from('src/main/java')
    filteringCharset = 'UTF-8'
    if (targetMinecraft == '1.21.11') {
        // Mojang renamed the identifier type without changing its representation.
        filter { String line -> line.replaceAll(/\bResourceLocation\b/, 'Identifier')
                .replace('.location()', '.identifier()')
                .replace('readResourceLocation', 'readIdentifier').replace('writeResourceLocation', 'writeIdentifier') }
    }
    into layout.buildDirectory.dir('versionSources/java')
}
def prepareVersionResources = tasks.register('prepareVersionResources', Sync) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    overlayDirectories.reverseEach { from(new File(it, 'resources')) }
    from('src/main/resources')
    from('src/generated/resources')
    exclude('**/*.bbmodel', '**/.cache/**', '**/.DS_Store', '**/Thumbs.db')
    into layout.buildDirectory.dir('versionSources/resources')
}
sourceSets.main.java.setSrcDirs([prepareVersionJava])
sourceSets.main.resources.setSrcDirs([prepareVersionResources])

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = requestedMinecraft.isPresent() ? "${mod_version}+mc${targetMinecraft}" : mod_version
group = mod_group_id

tasks.named('processResources', ProcessResources).configure {
    from(['LICENSE', 'TEMPLATE_LICENSE.txt']) {
        into 'META-INF'
    }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.ryanhcode.dev/releases' }
        }
        filter { includeGroup 'dev.ryanhcode.sable-companion' }
    }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://maven.architectury.dev' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

tasks.named('sourcesJar', Jar).configure {
    from(['LICENSE', 'TEMPLATE_LICENSE.txt']) {
        into 'META-INF'
    }
}

neoForge {
    enable {
        version = project.neo_version
        disableRecompilation = providers.gradleProperty('fastBuild').getOrElse('false').toBoolean()
    }

    if (targetMinecraft == '1.21.1') {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    runs {
        client {
            client()
            if (providers.gradleProperty('clientGameDir').isPresent()) {
                gameDirectory = file(providers.gradleProperty('clientGameDir').get())
            }
            if (providers.gradleProperty('previewWorld').isPresent()) {
                programArguments.addAll '--quickPlaySingleplayer', providers.gradleProperty('previewWorld').get(), '--width', '1280', '--height', '800'
            }
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            if (targetMinecraft.tokenize('.').last().toInteger() >= 5 && targetMinecraft != '1.21') clientData()
            else data()

            def dataOutput = requestedMinecraft.isPresent()
                    ? layout.buildDirectory.dir('generatedData').get().asFile : file('src/generated/resources/')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', dataOutput.absolutePath,
                    '--existing', layout.buildDirectory.dir('versionSources/resources').get().asFile.absolutePath
        }

        configureEach {
            if (requestedMinecraft.isPresent()
                    && !(name == 'client' && providers.gradleProperty('clientGameDir').isPresent())) {
                gameDirectory = layout.buildDirectory.dir("run/${name}").get().asFile
            }
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
    if (compatibilitySmoke) {
        unitTest {
            enable()
            testedMod = mods."${mod_id}"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    if (targetMinecraft == '1.21') {
        // The final 1.21 NeoForge predates WrapMethod; bootstrap the newer
        // MixinExtras implementation required by the greenhouse mutation guard.
        jarJar(implementation('io.github.llamalad7:mixinextras-neoforge:0.5.3')) {
            version { strictly '[0.5.3,0.6)'; prefer '0.5.3' }
        }
    }
    if (compatibilitySmoke) {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation "net.neoforged:testframework:${neo_version}"
    }
    // Safe identity implementation without Sable; Sable supplies the live ship poses when installed.
    if (targetMinecraft == '1.21.1') {
        jarJar(api('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:[1.6.0,2.0)')) {
            version { prefer '1.6.0' }
        }
    }
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    // Optional, client-only JEI utility button hooks; never bundled in the release JAR.
    compileOnly("mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}") { transitive = false }
    compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1:api'
    compileOnly 'me.shedaniel:RoughlyEnoughItems-api-neoforge:16.0.799'

    if (providers.gradleProperty('compatModsDir').isPresent()) {
        localRuntime fileTree(dir: providers.gradleProperty('compatModsDir').get(), include: ['*.jar'],
                exclude: ['biome_based_crops-*.jar'])
    } else if (providers.gradleProperty('includeLocalMods').getOrElse(targetMinecraft == '1.21.1' ? 'true' : 'false').toBoolean()) {
        localRuntime fileTree(dir: 'libs', include: ['*.jar'])
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    if (compatibilitySmoke) {
        useJUnitPlatform()
        maxHeapSize = '1G'
        maxParallelForks = 1
        workingDir = layout.buildDirectory.dir('compatSmoke').get().asFile
        doFirst { workingDir.mkdirs() }
        testLogging { events 'passed', 'failed', 'skipped' }
    }
}

// ModDevGradle configures its JUnit working directory after project evaluation.
// Apply ours afterwards so parallel version tests cannot share configs or logs.
afterEvaluate {
    if (compatibilitySmoke) {
        tasks.named('test', Test).configure {
            workingDir = layout.buildDirectory.dir('compatSmoke').get().asFile
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Inspect the artifact itself, so a future source-set or resource-copy change cannot ship tests or editor files.
abstract class VerifyReleaseJar extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getReleaseJar()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getMainClassDirectories()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getMainResourceDirectories()

    @Input
    abstract ListProperty<String> getRequiredEntries()

    private static Set<String> filesBelow(Set<File> roots) {
        Set<String> paths = new HashSet<>()
        roots.findAll { it.isDirectory() }.each { root ->
            java.nio.file.Files.walk(root.toPath()).withCloseable { files ->
                files.filter { java.nio.file.Files.isRegularFile(it) }.forEach { path ->
                    paths.add(root.toPath().relativize(path).toString().replace('\\', '/'))
                }
            }
        }
        return paths
    }

    @TaskAction
    void verify() {
        Set<String> classes = filesBelow(mainClassDirectories.files).findAll { it.endsWith('.class') } as Set
        Set<String> resources = filesBelow(mainResourceDirectories.files)
        List<String> problems = []
        new java.util.zip.ZipFile(releaseJar.get().asFile).withCloseable { archive ->
            Set<String> entries = Collections.list(archive.entries()).findAll { !it.directory }.collect { it.name } as Set
            entries.each { name ->
                if (name ==~ /(?i).*(GameTests?|Tests?|Harness)(\$[^\/]*)?\.class$/
                        || name ==~ /(?i).*(^|\/)(tests?|gametest|tools)(\/|$).*/) {
                    problems.add("test or development file: ${name}")
                } else if (name ==~ /(?i).*\.(java|kt|scala|groovy|py|pyc|pyo|bbmodel|snbt|psd|xcf|blend|log|jfr|hprof)$/
                        || name ==~ /.*(^|\/)(\.git|\.gradle|\.idea|\.vscode|__pycache__|\.cache)(\/|$).*/
                        || name.tokenize('/').last() in ['.DS_Store', 'Thumbs.db']) {
                    problems.add("development file: ${name}")
                } else if (name.endsWith('.class') && !classes.contains(name)) {
                    problems.add("class outside the main source set: ${name}")
                } else if (!classes.contains(name) && !resources.contains(name)
                        && !requiredEntries.get().contains(name) && name != 'META-INF/MANIFEST.MF'
                        && name != 'META-INF/jarjar/metadata.json'
                        && !(name.startsWith('META-INF/jarjar/') && name.endsWith('.jar'))) {
                    problems.add("unexpected packaged file: ${name}")
                }
            }
            (classes + requiredEntries.get()).findAll { !entries.contains(it) }.each {
                problems.add("missing runtime file: ${it}")
            }
        }
        if (!problems.isEmpty()) throw new GradleException("Release JAR hygiene check failed:\n" + problems.sort().join('\n'))
        logger.lifecycle("Verified release JAR: main runtime classes/resources only; test and development files excluded.")
    }
}

var verifyReleaseJar = tasks.register('verifyReleaseJar', VerifyReleaseJar) {
    group = 'verification'
    description = 'Checks the mod JAR for main classes, required metadata/licenses, and accidentally bundled test or development files.'
    dependsOn tasks.named('jar')
    releaseJar.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
    mainClassDirectories.from(sourceSets.main.output.classesDirs)
    mainResourceDirectories.from(sourceSets.main.resources.srcDirs)
    requiredEntries.set(['META-INF/LICENSE', 'META-INF/TEMPLATE_LICENSE.txt', 'META-INF/neoforge.mods.toml', "${mod_id}.mixins.json".toString()])
}

tasks.named('check').configure { dependsOn verifyReleaseJar }
