plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    exclude("**/*.bbmodel")
    exclude("**/.cache/**", "**/.DS_Store", "**/Thumbs.db")
}

tasks.named('processResources', ProcessResources).configure {
    from(['LICENSE', 'TEMPLATE_LICENSE.txt']) {
        into 'META-INF'
    }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.ryanhcode.dev/releases' }
        }
        filter { includeGroup 'dev.ryanhcode.sable-companion' }
    }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://maven.architectury.dev' }
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Safe identity implementation without Sable; Sable supplies the live ship poses when installed.
    jarJar(api('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:[1.6.0,2.0)')) {
        version { prefer '1.6.0' }
    }
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.53.0.425'
    // Optional, client-only JEI utility button hooks; never bundled in the release JAR.
    compileOnly('mezz.jei:jei-1.21.1-neoforge:19.53.0.425') { transitive = false }
    compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1:api'
    compileOnly 'me.shedaniel:RoughlyEnoughItems-api-neoforge:16.0.799'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: 'languages.gradle'
