plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

if (providers.gradleProperty('compatBuildDir').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('compatBuildDir').get())
}

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

tasks.named('processResources', ProcessResources).configure {
    from(['LICENSE', 'TEMPLATE_LICENSE.txt']) {
        into 'META-INF'
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://maven.architectury.dev' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            if (providers.gradleProperty('clientGameDir').isPresent()) {
                gameDirectory = file(providers.gradleProperty('clientGameDir').get())
            }
            if (providers.gradleProperty('previewWorld').isPresent()) {
                programArguments.addAll '--quickPlaySingleplayer', providers.gradleProperty('previewWorld').get(), '--width', '1280', '--height', '800'
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file(providers.gradleProperty('compatGameDir').getOrElse('build/gametest'))
            if (providers.gradleProperty('compatModsDir').isPresent()) {
                jvmArgument '-Xmx4G'
                jvmArgument '-XX:ActiveProcessorCount=2'
                systemProperty 'log4j.configurationFile', layout.buildDirectory.file('moddev/gameTestServerLog4j2.xml').get().asFile.toURI().toString()
                systemProperty 'log4j2.configurationFile', layout.buildDirectory.file('moddev/gameTestServerLog4j2.xml').get().asFile.toURI().toString()
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (providers.gradleProperty('enableGameTests').getOrElse('false').toBoolean()) {
                sourceSet(sourceSets.gameTest)
            }
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.53.0.425'
    compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1:api'
    compileOnly 'me.shedaniel:RoughlyEnoughItems-api-neoforge:16.0.799'

    if (providers.gradleProperty('compatModsDir').isPresent()) {
        localRuntime fileTree(dir: providers.gradleProperty('compatModsDir').get(), include: ['*.jar'],
                exclude: ['biome_based_crops-*.jar'])
    } else if (providers.gradleProperty('includeLocalMods').getOrElse('true').toBoolean()) {
        localRuntime fileTree(dir: 'libs', include: ['*.jar'])
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.neoforged:testframework:${neo_version}"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    maxHeapSize = providers.gradleProperty('compatModsDir').isPresent() ? '4G' : '2G'
    if (providers.gradleProperty('compatGameDir').isPresent()) {
        workingDir = file(providers.gradleProperty('compatGameDir').get())
        systemProperty 'log4j.configurationFile', layout.buildDirectory.file('moddev/junit/log4j2.xml').get().asFile.toURI().toString()
        systemProperty 'log4j2.configurationFile', layout.buildDirectory.file('moddev/junit/log4j2.xml').get().asFile.toURI().toString()
    }
    systemProperty 'biomeBasedCrops.projectDir', layout.projectDirectory.asFile.absolutePath
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
