name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: bash ./gradlew build -PincludeLocalMods=false

      - name: Verify plant growth in game
        run: bash ./gradlew runGameTestServer -PenableGameTests=true -PincludeLocalMods=false

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: biome-based-crops-${{ github.sha }}
          path: build/libs/biome_based_crops-*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: biome-based-crops-${{ github.sha }}
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" release/*.jar --verify-tag --title "Biome Based Crops $GITHUB_REF_NAME" --notes-file CHANGELOG.md
