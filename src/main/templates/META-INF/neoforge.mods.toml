modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/IWasCool/biome-based-crops/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/IWasCool/biome-based-crops"
logoFile="assets/icon.png"
authors="Izcool"
description='''
Configurable crop and sapling growth using climates, biome IDs, and biome tags.
Includes optional support for Farmer's Delight crop add-ons, Biomes O' Plenty climate tags and saplings, and active Tough As Nails thermoregulators and thermometers.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="biomesoplenty"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="toughasnails"
    type="optional"
    ordering="AFTER"
    side="BOTH"
